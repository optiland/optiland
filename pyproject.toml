[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "optiland"
authors = [{ name = "Kramer Harrison", email = "kdanielharrison@gmail.com" }]
description = "Open Source Optical Design in Python"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "vtk",
    "tabulate",
    "numba>=0.60.0",
    "requests",
    "seaborn",
    "typing-extensions>=4.1.0",
]
license = { text = "MIT License" }
dynamic = ["version"]

[project.optional-dependencies]
manufacturing = ["ezdxf>=1.0.0"]
prescription-console = ["rich>=13.0"]
prescription-pdf = ["reportlab>=4.0"]
prescription = ["rich>=13.0", "reportlab>=4.0"]
gui = [
    # 6.12 wheels corrupt singleton refcounts on Python 3.11 (PYSIDE-3474).
    # Revisit this bound once a corrected wheel passes the shutdown regression.
    "PySide6<6.12; python_version < '3.12'",
    "PySide6; python_version >= '3.12'",
    "qtconsole",
]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/optiland/optiland"
Repository = "https://github.com/optiland/optiland"
Documentation = "https://www.optiland.org/docs/"
"Bug Tracker" = "https://github.com/optiland/optiland/issues"

[project.scripts]
optiland = "optiland_gui.run_gui:main"

# Third-party plugin discovery (Phase 0.5, SPEC_Tech_Debt_20260705.md). A
# plugin package declares one of these groups pointing at a zero-argument
# callable that registers itself against the relevant Optiland registry; see
# optiland/plugins.py and CONTRIBUTING.md for the "add a new X" walkthrough.
[project.entry-points."optiland.surfaces"]
[project.entry-points."optiland.materials"]
[project.entry-points."optiland.analyses"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["optiland", "optiland_gui"]

[tool.hatch.metadata.files]
"optiland/database" = ["*.csv", "*.yml", "**/*.yml", "*.npy"]
"optiland" = ["py.typed"]
"optiland_gui" = ["py.typed"]

[tool.hatch.version]
source = "versioningit"
default-version = "0.0.0+unknown"

[tool.ruff]
line-length = 88
exclude = ["tests", "docs", "optiland_gui/resources/resources_rc.py", "README.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "PYI", # pyright
    "TC",  # type-checking
    # pydocstyle: missing-docstring only, scoped to top-level public API
    # (module/class/function). D105 (magic methods) and docstring content/format
    # rules (D2xx/D4xx) stay off; enabling them would flag ~480 pre-existing
    # internals, which is exactly the one-time fixup burden constraint 4 rules
    # out. D102 (methods) and D107 (__init__) are enabled via the ratchet in
    # [tool.ruff.lint.per-file-ignores]: subpackages listed there still have
    # undocumented methods and are fixed one entry per PR (see issue #1062).
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D103", # undocumented-public-function
    "D102", # undocumented-public-method
    "D107", # undocumented-public-init
]
exclude = ["*.ipynb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D103"]
"docs/**" = ["D100", "D101", "D103"]
# Standalone debug/reproduction scripts, not part of the package API.
"optiland/scripts/**" = ["D100", "D101", "D103"]
# Ratchet for D102/D107 (issue #1062): every subpackage below still has
# undocumented public methods/__init__; one entry is removed per PR as its
# docstrings are completed. Last entry removed wins — delete this block
# entirely when the list is empty.
"optiland/optimization/**" = ["D102", "D107"]
"optiland/thin_film/**" = ["D102", "D107"]
"optiland/visualization/**" = ["D102", "D107"]
"optiland/samples/**" = ["D102", "D107"]
"optiland/analysis/**" = ["D102", "D107"]
"optiland/aperture/**" = ["D102", "D107"]
"optiland/geometries/**" = ["D102", "D107"]
"optiland/sequences/**" = ["D102", "D107"]
"optiland/phase/**" = ["D102", "D107"]
"optiland/materials/**" = ["D102", "D107"]
"optiland/fileio/**" = ["D102", "D107"]
"optiland/surfaces/**" = ["D102", "D107"]
"optiland/wavefront/**" = ["D102", "D107"]
"optiland/rays/**" = ["D102", "D107"]
"optiland/physical_apertures/**" = ["D102", "D107"]
"optiland/jones.py" = ["D102", "D107"]
"optiland/coatings.py" = ["D102", "D107"]
"optiland/tolerancing/**" = ["D102", "D107"]
"optiland/prescription/**" = ["D102", "D107"]
"optiland/interactions/**" = ["D102", "D107"]
"optiland/psf/**" = ["D102", "D107"]
"optiland/optic/**" = ["D102", "D107"]
"optiland/distribution.py" = ["D102", "D107"]
"optiland/mtf/**" = ["D102", "D107"]
"optiland/apodization/**" = ["D102", "D107"]
"optiland/aberrations/**" = ["D102", "D107"]
"optiland_gui/**" = ["D102", "D107"]
"optiland/zernike/**" = ["D102", "D107"]
"optiland/solves/**" = ["D102", "D107"]
"optiland/scatter.py" = ["D102", "D107"]
"optiland/raytrace/**" = ["D102", "D107"]
"optiland/pickup.py" = ["D102", "D107"]
"optiland/physical_optics/**" = ["D102", "D107"]
"optiland/fields/**" = ["D102", "D107"]
"optiland/backend/**" = ["D102", "D107"]
"optiland/sources/**" = ["D102", "D107"]
"optiland/paraxial_path.py" = ["D102", "D107"]
"optiland/multiconfig/**" = ["D102", "D107"]
"optiland/ml/**" = ["D102", "D107"]# Documentation build tooling (scripts/docs), not part of the package API.
"scripts/**" = ["D100", "D101", "D103"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "codecov>=2.1.13",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6",
    "mypy>=1.13",
    "ruff==0.17.3", # pinned: keep in sync with .pre-commit-config.yaml
    "vulture>=2.13", # dead-code audits (see CONTRIBUTING.md); not run in CI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--dist loadfile"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^tests/", "^docs/", "^optiland_gui/"]

[[tool.mypy.overrides]]
# The rest of the package hasn't been annotated yet, so its errors are
# suppressed by default; modules move out of this block and into the strict
# allowlist below as they get cleaned up.
module = "optiland.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Modules graduate into this strict allowlist as their annotations are
# cleaned up; the global baseline above stays permissive so CI never goes
# red while the rest of the package is ratcheted up module by module.
#
# `strict = true` is deliberately not used: in a per-module override it
# leaks strictness onto every other module in the run instead of scoping to
# these. The flags below are `--strict`'s expansion minus the two options
# mypy rejects per-module (warn_unused_configs, warn_redundant_casts).
ignore_errors = false
module = [
    "optiland.wavelength",
    "optiland.diagnostics.*",
    "optiland._types",
    "optiland._deprecation",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
strict_concatenate = true
