name: Weekly dependency compatibility

on:
  schedule:
    # Friday morning: leave contributors the weekend to investigate failures.
    - cron: '23 3 * * 5'
  workflow_dispatch:
    inputs:
      rows:
        description: 'Comma-separated row IDs; empty runs every combination'
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/compatibility-matrix.toml'
      - '.github/workflows/weekly-compatibility.yml'
      - 'scripts/ci/**'
      - 'tests/ci/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: weekly-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: '0.12.13'
  QT_QPA_PLATFORM: offscreen

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/ci/compatibility_matrix.py validate
      - run: python -m unittest discover -s tests/ci -v

  prepare:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || github.repository == 'optiland/optiland')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      runner: ${{ steps.matrix.outputs.runner }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      timeout_minutes: ${{ steps.matrix.outputs.timeout_minutes }}
      artifact_retention_days: ${{ steps.matrix.outputs.artifact_retention_days }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: matrix
        env:
          SELECTED_ROWS: ${{ inputs.rows }}
        run: python scripts/ci/compatibility_matrix.py matrix --rows "$SELECTED_ROWS"

  tests:
    name: Compatibility (${{ matrix.id }}, Python ${{ matrix.python }})
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ROW_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ matrix.id }}
          cache-dependency-glob: |
            .github/compatibility-matrix.toml
            pyproject.toml
            uv.lock
      - name: Install system dependencies
        id: system
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shm0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-xfixes0 \
            libdbus-1-3 libxkbcommon-x11-0 xvfb
      - name: Create isolated environment
        id: environment
        run: |
          mkdir -p "compatibility-reports/$ROW_ID"
          cp .github/compatibility-matrix.toml "compatibility-reports/$ROW_ID/matrix.toml"
          uv --version > "compatibility-reports/$ROW_ID/uv-version.txt"
          uv venv .compat-venv --python "$(command -v python)"
      - name: Resolve the selected combination
        id: resolve
        run: .compat-venv/bin/python scripts/ci/compatibility_matrix.py resolve --row "$ROW_ID"
      - name: Install the resolved environment and checkout
        id: install
        shell: bash
        run: |
          set -o pipefail
          {
            uv pip sync --python .compat-venv/bin/python \
              --require-hashes --only-binary :all: --torch-backend cpu \
              "compatibility-reports/$ROW_ID/requirements.txt"
            uv pip install --python .compat-venv/bin/python --no-deps -e .
            uv pip check --python .compat-venv/bin/python
            git diff --exit-code -- uv.lock
          } 2>&1 | tee "compatibility-reports/$ROW_ID/install.log"
      - name: Verify versions, backends and JIT
        id: verify
        run: |
          export RUNNER_IMAGE_VERSION="$ImageVersion"
          .compat-venv/bin/python scripts/ci/compatibility_matrix.py verify --row "$ROW_ID" \
            2>&1 | tee "compatibility-reports/$ROW_ID/verify.log"
      - name: Run the full suite with coverage
        id: tests
        run: |
          xvfb-run -a .compat-venv/bin/python -m pytest tests --durations=25 \
            --cov --cov-report="xml:compatibility-reports/$ROW_ID/coverage.xml" \
            --junitxml="compatibility-reports/$ROW_ID/junit.xml" \
            2>&1 | tee "compatibility-reports/$ROW_ID/pytest.log"
      - name: Record stage outcomes
        if: always()
        env:
          STEP_OUTCOMES: >-
            {"system":"${{ steps.system.outcome }}",
             "environment":"${{ steps.environment.outcome }}",
             "resolve":"${{ steps.resolve.outcome }}",
             "install":"${{ steps.install.outcome }}",
             "verify":"${{ steps.verify.outcome }}",
             "tests":"${{ steps.tests.outcome }}"}
        run: python scripts/ci/compatibility_matrix.py record --row "$ROW_ID"
      - name: Upload diagnostics (including failed rows)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.id }}
          path: compatibility-reports/${{ matrix.id }}/
          retention-days: ${{ fromJSON(needs.prepare.outputs.artifact_retention_days) }}
          if-no-files-found: error

  summary:
    needs: [prepare, tests]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: compatibility-*
          path: downloaded-reports
      - name: Summarize results
        if: always()
        env:
          SELECTED_ROWS: ${{ inputs.rows }}
        run: |
          mkdir -p compatibility-reports
          for directory in downloaded-reports/compatibility-*; do
            if [ -d "$directory" ]; then
              cp -r "$directory" "compatibility-reports/${directory##*/compatibility-}"
            fi
          done
          python scripts/ci/compatibility_matrix.py summary --rows "$SELECTED_ROWS"
