name: Guard

# Informational PR report (size, public API, dependencies, quality ratchet,
# test integrity, doc references), written to the job summary. It never fails
# on findings. Security: runs on `pull_request` (fork code gets a read-only
# token and no secrets), needs only read access and posts no comments.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv sync --frozen --group dev
      - name: Write Guard report to the job summary
        env:
          BASE_REF: ${{ github.base_ref }}
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: uv run --frozen python -m scripts.guard --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
